name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  galciv2:
    name: Build for Galactic Civilizations II
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Build the data
      run: |
        python3 scripts/generate-mod.py --version '0.0.0' --game galciv2

  stellaris:
    name: Build for Stellaris
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Build the mod
      run: |
        python3 scripts/generate-mod.py --version '0.0.0' --game stellaris
