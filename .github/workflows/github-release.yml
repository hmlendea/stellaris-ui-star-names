name: GitHub Release

on:
  release:
    types: [ published ]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
    - name: Check out the repository
      uses: actions/checkout@v7

    - name: Extract the version from the GitHub tag
      id: version
      run: |
        VERSION="${{ github.event.release.tag_name }}"
        VERSION="${VERSION#v}"
        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

    - name: Generate the mod
      shell: bash
      run: |
        python3 scripts/generate-mod.py "${{ steps.version.outputs.version }}"

    - name: Build the release archive
      id: package
      shell: bash
      run: |
        ARCHIVE_NAME="ui-star-names_${{ steps.version.outputs.version }}.zip"

        cd out/stellaris
        zip -r "${GITHUB_WORKSPACE}/${ARCHIVE_NAME}" "ui-star-names/" "ui-star-names.mod"

        echo "archive_name=${ARCHIVE_NAME}" >> "$GITHUB_OUTPUT"

    - name: Publish the release asset
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ steps.package.outputs.archive_name }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
